# CI for engram npm-workspaces monorepo (Node >=20, ESM, TypeScript).
# Requires committed root package-lock.json for npm ci to succeed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (core → cli → panel)
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint --if-present
