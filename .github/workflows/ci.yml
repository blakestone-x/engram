name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
          - os: ubuntu-latest
            node-version: 22
          - os: ubuntu-latest
            node-version: 24
          - os: windows-latest
            node-version: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all four packages
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Smoke
        run: npm run smoke

  dependency-candidate:
    name: Dependency refresh candidate
    if: github.head_ref == 'docs/reviewer-readiness-2026-09-16'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve supported dependency updates without lifecycle scripts
        run: |
          npm pkg set 'devDependencies.vitest=^4.1.11'
          npm pkg set 'devDependencies.vitest=^4.1.11' --workspace @engram/core
          npm update --package-lock-only --ignore-scripts
      - name: Report candidate lockfile and manifests
        run: |
          node -e "const fs=require('node:fs'); for(const p of ['package-lock.json','package.json','packages/core/package.json']) console.log('ENGRAM_CANDIDATE='+JSON.stringify({path:p,content:fs.readFileSync(p,'utf8')}))"
      - name: Audit candidate
        run: npm audit --audit-level=moderate
      - name: Install and verify candidate
        run: |
          npm ci
          npm run build
          npm run lint
          npm run typecheck
          npm test
          npm run smoke
